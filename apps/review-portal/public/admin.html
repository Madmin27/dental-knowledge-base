<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="robots" content="noindex,nofollow,noarchive" />
    <title>Private dashboard · Dental Open Source</title>
    <link rel="stylesheet" href="/review/style.css" />
    <script type="module" src="/review/admin.js"></script>
  </head>
  <body>
    <header>
      <a class="brand" href="/">Dental <span>Open Source</span></a>
      <nav>
        <a href="/review/" id="workspace-link">Workspace</a
        ><label
          >Language
          <select id="language">
            <option value="en">English</option>
            <option value="tr">Türkçe</option>
          </select></label
        >
      </nav>
    </header>
    <main>
      <p class="eyebrow" id="eyebrow">PRIVATE · MANAGEMENT</p>
      <h1 id="title">Project dashboard</h1>
      <p class="intro" id="intro">
        Aggregate activity and the work awaiting your team.
      </p>
      <div class="toolbar">
        <label id="period-label"
          >Period
          <select id="period">
            <option value="7">7 days</option>
            <option value="30" selected>30 days</option>
            <option value="90">90 days</option>
          </select></label
        ><button id="refresh" type="button">Refresh</button
        ><a href="/review/login" id="reauth">Verify identity again</a>
      </div>
      <p id="status" role="status" aria-live="polite"></p>
      <div id="stats-error" class="error" role="alert" hidden></div>
      <div id="stats-content" hidden></div>
    </main>
    <footer>
      <span>Dental Open Source</span
      ><span id="private-note">Authorised managers only · UTC reporting</span>
    </footer>
  </body>
</html>
