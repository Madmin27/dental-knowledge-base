name: Repository checks

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Clinical data guard
        run: python3 scripts/check_clinical_data.py
      - name: Synthetic guard tests
        run: python3 -m unittest discover -s tests -v
      - name: Domain tests
        run: node tests/domain.test.mjs && node tests/rights.test.mjs && node tests/preview.test.mjs && node tests/atlas.test.mjs && node tests/anatomy-source.test.mjs && node tests/contributions.test.mjs && node tests/anatomical-review.test.mjs

  database:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine@sha256:18cfe3ef5e6815560c98237d6216d1e5119702fb0f3894c8785dd58b8bbe5d73
        env:
          POSTGRES_DB: dental_test
          POSTGRES_USER: dental_test
          POSTGRES_PASSWORD: synthetic-ci-only
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -U dental_test -d dental_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - run: npm ci --ignore-scripts
      - name: Synthetic PostgreSQL integration tests
        run: npm run test:db
        env:
          TEST_DATABASE_URL: postgresql://dental_test:synthetic-ci-only@127.0.0.1:${{ job.services.postgres.ports[5432] }}/dental_test
