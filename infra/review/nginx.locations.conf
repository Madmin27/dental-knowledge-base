# Include inside the dentalopensource.org HTTPS server. No public DB/identity ports.
location = /review { return 308 /review/; }
location ^~ /review/ {
    access_log off;
    error_log /var/log/nginx/dental-review-errors.log crit;
    client_max_body_size 1m;
    client_body_timeout 20s;
    proxy_request_buffering off;
    proxy_buffering off;
    proxy_pass http://127.0.0.1:3059;
    proxy_set_header Host $host;
    proxy_set_header X-Dental-Client $remote_addr;
    proxy_set_header X-Forwarded-For "";
    proxy_set_header X-Forwarded-Host "";
    proxy_set_header X-Forwarded-Proto "";
    proxy_read_timeout 75s;
}
location ^~ /auth/realms/dental/ {
    access_log off;
    error_log /var/log/nginx/dental-review-errors.log crit;
    client_max_body_size 32k;
    proxy_pass http://127.0.0.1:8079;
    proxy_set_header Host $host;
    proxy_set_header Forwarded "";
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Port 443;
    proxy_set_header X-Forwarded-Prefix "";
}
location ^~ /auth/resources/ {
    access_log off;
    proxy_pass http://127.0.0.1:8079;
    proxy_set_header Host $host;
}
# Admin console, master realm and management endpoints remain private.
location /auth/ { return 404; }
