# HTTP bootstrap only, until DNS and a valid certificate are available.
# Replace with dental-public.nginx.conf.example once TLS is ready.
server {
    listen 80;
    server_name dentalopensource.org;
    access_log off;
    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }
    location / {
        default_type text/plain;
        add_header Retry-After 3600 always;
        return 503 "Dental Open Source: HTTPS setup in progress.\n";
    }
}
